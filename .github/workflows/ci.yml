name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: runs in ~30s and does not need the mock OPC UA server, so it
  # reports long before the end-to-end suite finishes.
  lint:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/server-node/package-lock.json

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Ruff lint (Python)
        run: uv run ruff check .

      - name: Ruff format check (Python)
        run: uv run ruff format --check .

      - name: Install Node dependencies
        working-directory: packages/server-node
        run: npm ci

      - name: Prettier check (TypeScript)
        working-directory: packages/server-node
        run: npm run format:check

      - name: Typecheck (TypeScript)
        working-directory: packages/server-node
        run: npm run typecheck

      # Unit tests need no mock OPC UA server: seconds, not the ~50s e2e suite.
      - name: Build Node server
        working-directory: packages/server-node
        run: npm run build

      - name: Unit tests (Node)
        working-directory: packages/server-node
        run: npm test

      - name: Unit tests (Python)
        working-directory: tests
        run: uv run --no-sync pytest -v unit/

  e2e:
    name: End-to-end suite (Python + Node)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/server-node/package-lock.json

      - name: Build Node server
        working-directory: packages/server-node
        run: |
          npm ci
          npm run build

      - name: Sync workspace (all packages)
        run: uv sync --all-packages

      - name: Run end-to-end tests
        working-directory: tests
        run: uv run --no-sync pytest -v e2e/

  # Builds the real npm tarball and Python wheel, installs them somewhere
  # isolated, and drives the installed entry points. The rest of CI runs from the
  # source tree and from uv.lock, so it cannot see packaging faults or an
  # unbounded dependency resolving to a breaking major.
  smoke:
    name: Packaged artifacts (npm tarball + wheel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/server-node/package-lock.json

      - name: Build Node server
        working-directory: packages/server-node
        run: |
          npm ci
          npm run build

      - name: Sync workspace (all packages)
        run: uv sync --all-packages

      - name: Run artifact smoke tests
        working-directory: tests
        run: uv run --no-sync pytest -v -m smoke smoke/
