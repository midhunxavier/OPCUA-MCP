name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end suite (Python + Node)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Node server
        working-directory: packages/server-node
        run: |
          npm ci
          npm run build

      - name: Sync workspace (all packages)
        run: uv sync --all-packages

      - name: Run end-to-end tests
        working-directory: tests
        run: uv run --no-sync pytest -v
